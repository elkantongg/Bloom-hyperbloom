<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloom — plans that actually happen</title>
  <meta name="description" content="Paint when you're free, swipe on where to go, and watch your group's plan bloom.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Bloom home">
      <img src="icon.svg" width="32" height="32" alt="">
      <span>Bloom</span>
    </a>

    <nav class="home-nav" aria-label="Main">
      <ul>
        <li><button type="button" class="nav-link" data-scroll="how">How it works</button></li>
        <li><button type="button" class="nav-link" data-scroll="versus">Why Bloom</button></li>
        <li><button type="button" class="nav-link" data-scroll="myGroupsTitle" id="navGroups" hidden>Your groups</button></li>
        <li><button type="button" class="nav-link" id="navDemo">Try the demo</button></li>
        <li><button type="button" class="btn small" data-scroll="startForm" data-focus="planTitle">Create a group</button></li>
      </ul>
    </nav>

    <nav class="steps-nav" aria-label="Plan steps">
      <ol class="stepper" id="stepper">
        <li><button type="button" data-step="times"><span class="num">1</span><span class="lbl">When</span></button></li>
        <li><button type="button" data-step="places"><span class="num">2</span><span class="lbl">Where</span></button></li>
        <li><button type="button" data-step="bloom"><span class="num">3</span><span class="lbl">Bloom</span></button></li>
      </ol>
    </nav>

    <div class="top-actions">
    <div class="zoom" role="group" aria-label="Page size">
      <button type="button" class="zoom-btn" id="zoomOut" aria-label="Make everything smaller">−</button>
      <button type="button" class="zoom-val" id="zoomReset" aria-label="Page size 100%. Click to reset">100%</button>
      <button type="button" class="zoom-btn" id="zoomIn" aria-label="Make everything bigger">+</button>
    </div>

    <div class="a11y-wrap">
      <button type="button" class="icon-btn" id="a11yBtn" aria-expanded="false" aria-controls="a11yPanel" aria-label="Accessibility settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="4.5" r="2" fill="currentColor"/><path d="M4 8.5l8 1.5 8-1.5M12 10v5m0 0l-3.5 6M12 15l3.5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="a11y-panel" id="a11yPanel" role="group" aria-labelledby="a11yTitle" hidden>
        <h2 id="a11yTitle">Make Bloom work for you</h2>
        <p class="pref-note">Tip: use <strong>− 100% +</strong> in the top bar to make everything bigger or smaller.</p>
        <label class="pref"><input type="checkbox" data-pref="counts"><span><strong>Numbers on the grid</strong><small>See how many are free without relying on colour</small></span></label>
        <label class="pref"><input type="checkbox" data-pref="calm"><span><strong>Calm mode</strong><small>Turn off animations and confetti</small></span></label>
        <label class="pref"><input type="checkbox" data-pref="contrast"><span><strong>High contrast</strong><small>Stronger text and borders</small></span></label>
      </div>
    </div>

    <button type="button" class="icon-btn" id="themeToggle" aria-label="Switch to dark theme">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="toasts" class="toasts" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
